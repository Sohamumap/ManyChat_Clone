# FlowDM: Instagram DM automation
#   docker compose up -d --build
# Sized to run comfortably on a 1 GB AWS t3.micro (see docs/DEPLOY_AWS.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowdm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: flowdm
    command: postgres -c shared_buffers=64MB -c max_connections=40 -c work_mem=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdm -d flowdm"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    image: flowdm-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://flowdm:${POSTGRES_PASSWORD}@db:5432/flowdm
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: flowdm-backend
    restart: unless-stopped
    command: python -m app.jobs.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://flowdm:${POSTGRES_PASSWORD}@db:5432/flowdm
      ENVIRONMENT: ${ENVIRONMENT:-production}
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy  # api runs the database migrations first

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
